// ══════════════════════════════════════════════════════
//  🧠 SMART AUTO-STATUS LOGIC
//  Rules:
//  1. If manually set to "cancelled" or "reserved" → keep it
//  2. If date_issued is filled AND qty_issued >= qty → "served"
//  3. If date_issued is filled AND qty_issued < qty  → "partial"
//  4. If date_issued is empty                        → "pending"
//  5. If no qty_issued field, use date_issued only:
//     filled = served, empty = pending
// ══════════════════════════════════════════════════════
function computeStatus(data) {
  // Never override manually cancelled or reserved
  const manual = (data.status||"").toLowerCase();
  if (manual === "cancelled" || manual === "reserved") return manual;

  const hasIssued = data.date_issued && data.date_issued.trim() !== "";

  if (!hasIssued) return "pending";

  // If qty_issued is tracked
  if (data.qty_issued !== undefined && data.qty_issued !== "" && data.qty_issued !== null) {
    const issued = Number(data.qty_issued) || 0;
    const total  = Number(data.qty) || 0;
    if (issued <= 0)        return "pending";
    if (issued >= total)    return "served";
    return "partial";
  }

  // No qty_issued field — date_issued filled = served
  return "served";
}

// ── NORMALIZE STATUS ──────────────────────────────────
const normSt = s => { const v=(s||"pending").toLowerCase(); return SC[v]?v:"pending"; };

// ── FIREBASE LISTENER ─────────────────────────────────
const q = query(collection(db, COL), orderBy("rs_date","desc"));
onSnapshot(q, snap => {
  records = snap.docs.map(d => {
    const data = {...d.data(), _fid: d.id};
    // Apply smart status on every load
    const smart = computeStatus(data);
    // Only override if not manually cancelled/reserved
    const manual = (data.status||"").toLowerCase();
    if (manual !== "cancelled" && manual !== "reserved") {
      data.status = smart;
    }
    return data;
  });
  loading = false;
  render();
}, err => {
  loading = false;
  document.getElementById("app").innerHTML =
    `<div style="padding:40px;text-align:center;color:#ef4444">
      ⚠️ Firebase error: ${esc(err.message)}<br>
      <small>Check your config keys in index.html</small></div>`;
});

// ── CRUD ──────────────────────────────────────────────
async function saveRecord(data) {
  // Compute status before saving
  const autoStatus = computeStatus(data);
  const manual = (data.status||"").toLowerCase();
  const finalStatus = (manual==="cancelled"||manual==="reserved") ? manual : autoStatus;

  await addDoc(collection(db, COL), {
    rs_date:      data.rs_date||"",
    description:  data.description||"",
    um:           data.um||"",
    qty:          Number(data.qty)||0,
    qty_issued:   data.qty_issued!==""&&data.qty_issued!==undefined ? Number(data.qty_issued) : "",
    rs_num:       data.rs_num||"",
    ws_num:       data.ws_num||"",
    location:     data.location||"",
    date_needed:  data.date_needed||"",
    date_issued:  data.date_issued||"",
    picked_up_by: data.picked_up_by||"",
    status:       finalStatus,
    encoded_by:   data.encoded_by||"",
    remarks:      data.remarks||"",
    year:         data.rs_date ? +data.rs_date.slice(0,4) : new Date().getFullYear(),
    created_at:   serverTimestamp(),
  });
}

async function updateRecord(fid, data) {
  const autoStatus = computeStatus(data);
  const manual = (data.status||"").toLowerCase();
  const finalStatus = (manual==="cancelled"||manual==="reserved") ? manual : autoStatus;

  await updateDoc(doc(db, COL, fid), {
    rs_date:      data.rs_date||"",
    description:  data.description||"",
    um:           data.um||"",
    qty:          Number(data.qty)||0,
    qty_issued:   data.qty_issued!==""&&data.qty_issued!==undefined ? Number(data.qty_issued) : "",
    rs_num:       data.rs_num||"",
    ws_num:       data.ws_num||"",
    location:     data.location||"",
    date_needed:  data.date_needed||"",
    date_issued:  data.date_issued||"",
    picked_up_by: data.picked_up_by||"",
    status:       finalStatus,
    encoded_by:   data.encoded_by||"",
    remarks:      data.remarks||"",
    year:         data.rs_date ? +data.rs_date.slice(0,4) : new Date().getFullYear(),
  });
}

async function deleteRecord(fid) {
  if (!confirm("Delete this record? This cannot be undone.")) return;
  await deleteDoc(doc(db, COL, fid));
}

// ── STATUS BADGE WITH LOGIC HINT ──────────────────────
function statusBadgeHint(r) {
  const s = normSt(r.status);
  const hint =
    s==="served"    ? "✅ Date Issued filled — Auto Served" :
    s==="partial"   ? `🔵 ${r.qty_issued||0}/${r.qty} issued — Auto Partial` :
    s==="pending"   ? "⏳ No Date Issued yet — Auto Pending" :
    s==="cancelled" ? "❌ Manually Cancelled" :
    s==="reserved"  ? "🟣 Manually Reserved" : "";
  return `<div style="display:flex;flex-direction:column;gap:3px">${pill(r.status)}
    <span style="font-size:9px;color:#9ca3af">${hint}</span></div>`;
}

// ── CLOCK ─────────────────────────────────────────────
function tickClock() {
  const el = document.getElementById("clock-digital");
  if (!el) return;
  const now = new Date();
  const h=now.getHours()%12, m=now.getMinutes(), s=now.getSeconds();
  const pt=(deg,r)=>[26+r*Math.cos((deg-90)*Math.PI/180), 26+r*Math.sin((deg-90)*Math.PI/180)];
  const [hx,hy]=pt(h*30+m*0.5,11), [mx,my]=pt(m*6,15);
  const [sx,sy]=pt(s*6,17), [sbx,sby]=pt(s*6+180,4);
  const svg=document.getElementById("clock-svg");
  if(svg){
    svg.querySelector("#hhand").setAttribute("x2",hx.toFixed(2)); svg.querySelector("#hhand").setAttribute("y2",hy.toFixed(2));
    svg.querySelector("#mhand").setAttribute("x2",mx.toFixed(2)); svg.querySelector("#mhand").setAttribute("y2",my.toFixed(2));
    svg.querySelector("#shand").setAttribute("x1",sbx.toFixed(2));svg.querySelector("#shand").setAttribute("y1",sby.toFixed(2));
    svg.querySelector("#shand").setAttribute("x2",sx.toFixed(2)); svg.querySelector("#shand").setAttribute("y2",sy.toFixed(2));
  }
  el.innerHTML=`${p2(now.getHours())}:${p2(m)}:${p2(s)} <span style="font-size:11px;color:${GOLD}">${now.getHours()>=12?"PM":"AM"}</span>`;
  const dateEl=document.getElementById("clock-date");
  if(dateEl) dateEl.textContent=`${WDAYS[now.getDay()]}, ${MOS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}

// ── CHARTS ────────────────────────────────────────────
function barChart(data, W=680, H=210) {
  if(!data.length) return "";
  const maxV=Math.max(...data.map(d=>d.s+d.c+d.p+d.pa),1);
  const pad={t:10,r:10,b:30,l:45}, cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const gap=cw/data.length, bw=Math.max(4,gap*0.7);
  let bars="", labels="", yaxis="";
  for(let i=0;i<=4;i++){
    const yv=Math.round(maxV*i/4), yp=pad.t+ch-(ch*i/4);
    yaxis+=`<text x="${pad.l-5}" y="${yp+4}" text-anchor="end" font-size="9" fill="#9ca3af">${yv>=1000?(yv/1000).toFixed(1)+"k":yv}</text>
    <line x1="${pad.l}" y1="${yp}" x2="${pad.l+cw}" y2="${yp}" stroke="#f3f4f6" stroke-width="1"/>`;
  }
  data.forEach((d,i)=>{
    const x=pad.l+i*gap+(gap-bw)/2; let y=pad.t+ch;
    [{v:d.s,c:"#10b981"},{v:d.pa,c:"#3b82f6"},{v:d.p,c:"#f59e0b"},{v:d.c,c:"#ef4444"}].forEach(seg=>{
      if(!seg.v) return;
      const bh=(seg.v/maxV)*ch; y-=bh;
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" fill="${seg.c}" rx="1"/>`;
    });
    if(i%3===0) labels+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="9" fill="#9ca3af">${fmtMo(d.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">${yaxis}${bars}${labels}</svg>`;
}

function donutChart(data, S=160) {
  const cx=S/2, cy=S/2, R=cx*0.75, r=cx*0.45;
  const total=data.reduce((a,d)=>a+d.v,0);
  if(!total) return `<svg viewBox="0 0 ${S} ${S}" style="width:${S}px;height:${S}px"><circle cx="${cx}" cy="${cy}" r="${R}" fill="#f3f4f6"/></svg>`;
  let paths="", start=-Math.PI/2;
  data.forEach(d=>{
    if(!d.v) return;
    const angle=(d.v/total)*2*Math.PI;
    const large=angle>Math.PI?1:0;
    const x1=cx+R*Math.cos(start),y1=cy+R*Math.sin(start);
    const x2=cx+R*Math.cos(start+angle),y2=cy+R*Math.sin(start+angle);
    const xi=cx+r*Math.cos(start),yi=cy+r*Math.sin(start);
    const xj=cx+r*Math.cos(start+angle),yj=cy+r*Math.sin(start+angle);
    paths+=`<path d="M${xi.toFixed(2)},${yi.toFixed(2)} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${xj.toFixed(2)},${yj.toFixed(2)} A${r},${r} 0 ${large} 0 ${xi.toFixed(2)},${yi.toFixed(2)} Z" fill="${d.c}" opacity="0.9"/>`;
    start+=angle;
  });
  return `<svg viewBox="0 0 ${S} ${S}" style="width:${S}px;height:${S}px">${paths}</svg>`;
}

function renderDashboard() {
  const cnt={served:0,cancelled:0,pending:0,partial:0};
  records.forEach(r=>{ const s=normSt(r.status); if(s in cnt) cnt[s]++; });
  const tot={served:HIST.served+cnt.served,cancelled:HIST.cancelled+cnt.cancelled,pending:HIST.pending+cnt.pending,partial:HIST.partial+cnt.partial};
  const total=tot.served+tot.cancelled+tot.pending+tot.partial;
  const mmap={};
  MONTHLY_HIST.forEach(d=>{ mmap[d.m]={m:d.m,s:d.s,c:d.c,p:d.p,pa:d.pa}; });
  records.forEach(r=>{
    const mo=r.rs_date?r.rs_date.slice(0,7):null; if(!mo) return;
    if(!mmap[mo]) mmap[mo]={m:mo,s:0,c:0,p:0,pa:0};
    const st=normSt(r.status);
    if(st==="served") mmap[mo].s++; else if(st==="cancelled") mmap[mo].c++;
    else if(st==="pending") mmap[mo].p++; else if(st==="partial") mmap[mo].pa++;
  });
  const monthly=Object.values(mmap).sort((a,b)=>a.m.localeCompare(b.m)).slice(-12);
  const pie=[{v:tot.served,c:"#10b981",l:"Served"},{v:tot.cancelled,c:"#ef4444",l:"Cancelled"},{v:tot.pending,c:"#f59e0b",l:"Pending"},{v:tot.partial,c:"#3b82f6",l:"Partial"}];
  const encMap={}; records.forEach(r=>{ const e=r.encoded_by||"Unknown"; encMap[e]=(encMap[e]||0)+1; });
  const topEnc=Object.entries(encMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxEnc=topEnc[0]?.[1]||1;
  const pending=records.filter(r=>normSt(r.status)==="pending").slice(0,6);

  function kpi(label,value,sub,color,icon){

      ${sub?`<div style="font-size:11px;color:#9ca3af">${sub}</div>`:""}
    </div>`;
  }

  return `
  <div style="display:flex;flex-direction:column;gap:16px">
    <!-- Smart Status Notice -->
    <div style="background:linear-gradient(135deg,#0c1a2e,#1e293b);border-radius:12px;padding:14px 20px;border-left:4px solid ${GOLD};display:flex;align-items:center;gap:12px">

        <div style="font-size:11px;color:#94a3b8;margin-top:2px">
          No Date Issued → <b style="color:#f59e0b">Pending</b> &nbsp;|&nbsp;
          Date Issued + Partial Qty → <b style="color:#3b82f6">Partial</b> &nbsp;|&nbsp;
          Date Issued + Full Qty → <b style="color:#10b981">Served</b> &nbsp;|&nbsp;
          Manual Override → <b style="color:#ef4444">Cancelled</b> / <b style="color:#a855f7">Reserved</b>
        </div>
      </div>
    </div>

    <!-- KPIs -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px">
      ${kpi("Total Requests",total,"All time",GOLD,"📋")}
      ${kpi("Served",tot.served,`${((tot.served/total)*100).toFixed(1)}% fulfilled`,"#10b981","✅")}
      ${kpi("Pending",tot.pending,"No date issued yet","#f59e0b","⏳")}
      ${kpi("Cancelled",tot.cancelled,"Voided requests","#ef4444","❌")}
      ${kpi("Partial",tot.partial,"Partially issued","#3b82f6","🔵")}
    </div>

    <!-- Charts -->
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:14px">
      <div style="background:#fff;border-radius:14px;padding:18px 18px 10px;box-shadow:0 1px 4px rgba(0,0,0,.07)">
        <h4 style="margin:0 0 14px;font-size:13px;font-weight:800;color:#111827">Monthly RS Volume — Last 12 Months</h4>
        ${barChart(monthly)}
        <div style="display:flex;gap:12px;margin-top:8px;justify-content:center;flex-wrap:wrap">
          ${[{l:"Served",c:"#10b981"},{l:"Partial",c:"#3b82f6"},{l:"Pending",c:"#f59e0b"},{l:"Cancelled",c:"#ef4444"}].map(d=>`<div style="display:flex;align-items:center;gap:4px;font-size:11px"><span style="width:10px;height:10px;border-radius:2px;background:${d.c};display:inline-block"></span><span style="color:#6b7280">${d.l}</span></div>`).join("")}
        </div>
      </div>
      <div style="background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07)">
        <h4 style="margin:0 0 10px;font-size:13px;font-weight:800;color:#111827">Status Breakdown</h4>
        <div style="display:flex;justify-content:center">${donutChart(pie)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px">
          ${pie.map(d=>`<div style="display:flex;align-items:center;gap:4px;font-size:11px"><span style="width:8px;height:8px;border-radius:50%;background:${d.c};display:inline-block"></span><span style="color:#6b7280">${d.l}: <b style="color:#111827">${d.v.toLocaleString()}</b></span></div>`).join("")}

    <!-- Bottom Row -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
      <div style="background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07)">
        <h4 style="margin:0 0 12px;font-size:13px;font-weight:800;color:#111827">🏗️ Top Project Sites</h4>
        ${TOP_SITES.slice(0,7).map((l,i)=>`
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
            <span style="font-size:10px;color:#9ca3af;width:14px;text-align:right;flex-shrink:0">${i+1}</span>
            <div style="flex:1;min-width:0">

                <span style="font-size:11px;font-weight:800;color:${GOLD};flex-shrink:0">${l.n.toLocaleString()}</span>

              <div style="height:3px;background:#f3f4f6;border-radius:3px">
                <div style="height:3px;border-radius:3px;background:${GOLD};width:${(l.n/TOP_SITES[0].n*100).toFixed(1)}%"></div>

          :topEnc.map(([name,cnt])=>`

              <div style="flex:1;min-width:0">
                <div style="display:flex;justify-content:space-between">

                </div>
                <div style="height:3px;background:#f3f4f6;border-radius:3px;margin-top:3px">
                  <div style="height:3px;border-radius:3px;background:#0ea5e9;width:${(cnt/maxEnc*100).toFixed(1)}%"></div>

}

// ── RECORDS ───────────────────────────────────────────
function renderRecords() {
  const encoders=[...new Set(records.map(r=>r.encoded_by||"").filter(Boolean))].sort();
  let d=[...records];
  if(fSt!=="all") d=d.filter(r=>normSt(r.status)===fSt);
  if(fYr!=="all") d=d.filter(r=>String(r.year)===fYr);
  if(fEnc!=="all") d=d.filter(r=>(r.encoded_by||"")===fEnc);
  if(fQ.trim()){
    const lq=fQ.toLowerCase();
    d=d.filter(r=>(r.description||"").toLowerCase().includes(lq)||(r.location||"").toLowerCase().includes(lq)||
      (r.rs_num||"").includes(lq)||(r.ws_num||"").toLowerCase().includes(lq)||
      (r.picked_up_by||"").toLowerCase().includes(lq)||(r.encoded_by||"").toLowerCase().includes(lq));
  }
  d.sort((a,b)=>(b.rs_date||"").localeCompare(a.rs_date||""));
  const totalPages=Math.max(1,Math.ceil(d.length/PER));
  if(page>totalPages) page=totalPages;
  const paged=d.slice((page-1)*PER,page*PER);
  const thS=`padding:10px 12px;text-align:left;font-weight:700;color:${GOLD};border-bottom:2px solid ${GOLD};white-space:nowrap;font-size:11px`;
  const selStyle=`padding:7px 11px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:12px;background:#fff;color:#374151`;

  const rows=paged.map((r,i)=>{
    const bg=i%2===0?"#fff":"#fafafa";
    const qtyDisplay = r.qty_issued!==undefined&&r.qty_issued!==""
      ? `<span style="font-weight:700">${r.qty_issued}</span><span style="color:#9ca3af;font-size:10px">/${r.qty}</span>`
      : `<b>${r.qty}</b>`;
    return `<tr style="background:${bg};border-bottom:1px solid #f3f4f6" onmouseover="this.style.background='#fffbeb'" onmouseout="this.style.background='${bg}'">
      <td style="padding:8px 12px;white-space:nowrap;color:#374151">${fmtDate(r.rs_date)}</td>
      <td style="padding:8px 12px;white-space:nowrap"><span style="font-weight:700;color:${GOLD}">${esc(r.rs_num)||"—"}</span></td>
      <td style="padding:8px 12px;max-width:170px"><span title="${esc(r.description)}" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.description)}</span></td>
      <td style="padding:8px 12px;color:#6b7280;white-space:nowrap">${esc(r.um)}</td>
      <td style="padding:8px 12px;white-space:nowrap">${qtyDisplay}</td>
      <td style="padding:8px 12px;color:#6b7280;white-space:nowrap">${esc(r.ws_num)||"—"}</td>
      <td style="padding:8px 12px;max-width:150px"><span title="${esc(r.location)}" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.location)||"—"}</span></td>
      <td style="padding:8px 12px;white-space:nowrap">${fmtDate(r.date_needed)}</td>
      <td style="padding:8px 12px;white-space:nowrap">${fmtDate(r.date_issued)}</td>
      <td style="padding:8px 12px;white-space:nowrap">${esc(r.picked_up_by)||"—"}</td>
      <td style="padding:8px 12px;white-space:nowrap">${statusBadgeHint(r)}</td>
      <td style="padding:8px 12px;white-space:nowrap;background:#f0f7ff">
        <div style="display:flex;align-items:center;gap:5px">
          <div style="width:20px;height:20px;border-radius:50%;background:${SLATE};color:${GOLD};font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0">${esc(r.encoded_by||"?").charAt(0).toUpperCase()}</div>
          <span style="font-size:11px;font-weight:600">${esc(r.encoded_by)||"—"}</span>
        </div>
      </td>
      <td style="padding:8px 12px;max-width:110px;color:#6b7280"><span title="${esc(r.remarks)}" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.remarks)||"—"}</span></td>
      <td style="padding:8px 12px;white-space:nowrap">
        <button onclick='openEditModal(${JSON.stringify(r).replace(/'/g,"&#39;")})' style="margin-right:5px;padding:3px 10px;border-radius:6px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:11px;font-weight:700;color:#374151">Edit</button>
        <button onclick="deleteRecord('${r._fid}')" style="padding:3px 10px;border-radius:6px;border:1px solid #fecaca;background:#fff7f7;cursor:pointer;font-size:11px;font-weight:700;color:#ef4444">Del</button>
      </td>
    </tr>`;
  }).join("");

  const pgBtn=(label,pg,disabled)=>`<button onclick="setPage(${pg})" ${disabled?"disabled":""} style="padding:5px 12px;border-radius:7px;border:1px solid #e5e7eb;background:${disabled?"#f9fafb":"#fff"};cursor:${disabled?"default":"pointer"};font-size:12px;color:#374151">${label}</button>`;

  return `
  <div style="display:flex;flex-direction:column;gap:12px">
    <!-- Smart Status Legend -->
    <div style="background:#fff;border-radius:10px;padding:10px 16px;border:1px solid #e5e7eb;display:flex;gap:16px;flex-wrap:wrap;align-items:center">
      <span style="font-size:11px;font-weight:800;color:#374151">🧠 Auto-Status:</span>
      <span style="font-size:11px;color:#6b7280">⏳ No Date Issued = <b style="color:#f59e0b">Pending</b></span>
      <span style="font-size:11px;color:#6b7280">🔵 Partial Qty Issued = <b style="color:#3b82f6">Partial</b></span>
      <span style="font-size:11px;color:#6b7280">✅ Full Qty Issued = <b style="color:#10b981">Served</b></span>
      <span style="font-size:11px;color:#6b7280">❌ Manual = <b style="color:#ef4444">Cancelled</b></span>
    </div>

    <!-- Toolbar -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="fQ" value="${esc(fQ)}" placeholder="🔍 Search description, location, RS#, encoder…"
        style="flex:1 1 240px;padding:8px 14px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:13px;outline:none"/>
      <select id="fSt" style="${selStyle}">
        <option value="all"${fSt==="all"?" selected":""}>All Status</option>
        ${STATUSES.map(s=>`<option value="${s}"${fSt===s?" selected":""}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join("")}
      </select>
      <select id="fYr" style="${selStyle}">
        <option value="all"${fYr==="all"?" selected":""}>All Years</option>
        <option value="2025"${fYr==="2025"?" selected":""}>2025</option>
        <option value="2026"${fYr==="2026"?" selected":""}>2026</option>
      </select>
      <select id="fEnc" style="${selStyle}">
        <option value="all"${fEnc==="all"?" selected":""}>All Encoders</option>
        ${encoders.map(e=>`<option value="${esc(e)}"${fEnc===e?" selected":""}>${esc(e)}</option>`).join("")}
      </select>
      <button onclick="openAddModal()" style="padding:8px 18px;border-radius:8px;background:${GOLD};color:#fff;border:none;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap">+ Add Item</button>
    </div>

    <div style="font-size:11px;color:#6b7280">Showing ${paged.length} of ${d.length} records &nbsp;·&nbsp; Total: ${(HIST.total+records.length).toLocaleString()}</div>

    <!-- Table -->
    <div style="overflow-x:auto;border-radius:12px;border:1px solid #e5e7eb;background:#fff">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:${SLATE}">
          <th style="${thS}">RS Date</th>
          <th style="${thS}">RS #</th>
          <th style="${thS}">Description</th>
          <th style="${thS}">UM</th>
          <th style="${thS}">Qty / Issued</th>
          <th style="${thS}">WS #</th>
          <th style="${thS}">Location</th>
          <th style="${thS}">Needed</th>
          <th style="${thS}">Date Issued</th>
          <th style="${thS}">Picked Up By</th>
          <th style="${thS}">Status 🧠</th>
          <th style="padding:10px 12px;text-align:left;font-weight:700;color:#60a5fa;border-bottom:2px solid #60a5fa;white-space:nowrap;font-size:11px">Encoded By</th>
          <th style="${thS}">Remarks</th>
          <th style="${thS}">Actions</th>
        </tr></thead>
        <tbody>${rows||`<tr><td colspan="14" style="text-align:center;padding:48px;color:#9ca3af;font-size:13px">No records found.</td></tr>`}</tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div style="display:flex;align-items:center;justify-content:center;gap:6px">
      ${pgBtn("«",1,page===1)}
      ${pgBtn("‹ Prev",page-1,page===1)}
      <span style="font-size:12px;color:#6b7280;padding:0 8px">Page <b>${page}</b> of <b>${totalPages}</b></span>
      ${pgBtn("Next ›",page+1,page===totalPages)}
      ${pgBtn("»",totalPages,page===totalPages)}
    </div>
  </div>`;
}

        <button onclick="bulkSave()" style="padding:7px 18px;border-radius:8px;border:none;background:${GOLD};color:#fff;font-weight:800;cursor:pointer;font-size:13px">💾 Save All</button>

          ${["RS Date","Description *","UM","Total Qty","Qty Issued","RS #","WS #","Location *","Date Needed","Date Issued","Picked Up By","Encoded By *","Remarks","Status 🧠",""].map((h,i)=>`

// ── ENCODERS ──────────────────────────────────────────
function renderEncoders() {
  const map={};
  records.forEach(r=>{
    const e=r.encoded_by||"Unknown";
    if(!map[e]) map[e]={name:e,total:0,served:0,pending:0,cancelled:0,partial:0,last:""};
    map[e].total++;
    const s=normSt(r.status); if(s in map[e]) map[e][s]++;
    if((r.rs_date||"")>map[e].last) map[e].last=r.rs_date||"";
  });
  const stats=Object.values(map).sort((a,b)=>b.total-a.total);
  const medals=["🥇","🥈","🥉"]; const max=stats[0]?.total||1;
  if(!stats.length) return `<div style="text-align:center;padding:60px 20px;color:#9ca3af"><div style="font-size:48px;margin-bottom:12px">👤</div><div style="font-size:16px;font-weight:700;color:#374151">No encoder data yet</div></div>`;
  function kpi(l,v,c,i){return `<div style="background:#fff;border-radius:14px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid ${c}"><div style="display:flex;justify-content:space-between"><span style="font-size:11px;color:#6b7280;font-weight:700;text-transform:uppercase;letter-spacing:.4px">${l}</span><span style="font-size:18px">${i}</span></div><div style="font-size:26px;font-weight:900;color:#111827;line-height:1;margin-top:4px">${typeof v==="number"?v.toLocaleString():esc(v)}</div></div>`;}
  return `<div style="display:flex;flex-direction:column;gap:14px">
    <div><h3 style="margin:0 0 4px;font-size:16px;font-weight:800">Encoder Activity</h3><p style="margin:0;font-size:12px;color:#6b7280">Tracks who entered each RS record and their fulfillment breakdown.</p></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">
      ${kpi("Total Encoders",stats.length,GOLD,"👥")}${kpi("Records Encoded",records.length,"#0ea5e9","📝")}${kpi("Top Encoder",stats[0]?.name||"—","#10b981","🏆")}${kpi("Top Count",stats[0]?.total||0,"#a855f7","📊")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px">
      ${stats.map((e,idx)=>`<div style="background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:3px solid ${idx===0?GOLD:idx===1?"#9ca3af":idx===2?"#cd7f32":"#e5e7eb"}">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
          <div style="width:40px;height:40px;border-radius:50%;background:${SLATE};color:${GOLD};display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;flex-shrink:0">${esc(e.name).charAt(0).toUpperCase()}</div>
          <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.name)}</div><div style="font-size:10px;color:#9ca3af">Last entry: ${fmtDate(e.last)}</div></div>
          ${idx<3?`<span style="font-size:20px">${medals[idx]}</span>`:""}
        </div>
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:11px;color:#6b7280;font-weight:600">Total Encoded</span><span style="font-size:15px;font-weight:900;color:${GOLD}">${e.total}</span></div>
          <div style="height:6px;background:#f3f4f6;border-radius:6px"><div style="height:6px;border-radius:6px;background:${GOLD};width:${(e.total/max*100).toFixed(1)}%"></div></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          ${[{l:"Served",v:e.served,c:"#10b981"},{l:"Pending",v:e.pending,c:"#f59e0b"},{l:"Cancelled",v:e.cancelled,c:"#ef4444"},{l:"Partial",v:e.partial,c:"#3b82f6"}].map(s=>`<div style="background:#f9fafb;border-radius:7px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:10px;color:#6b7280;font-weight:600">${s.l}</span><span style="font-size:13px;font-weight:800;color:${s.c}">${s.v}</span></div>`).join("")}
        </div>
      </div>`).join("")}
    </div>
  </div>`;
}

// ── MODAL ─────────────────────────────────────────────
function renderModal() {
  const r=modal.rec||{};
  const v=(k,def="")=>esc(r[k]!==undefined?String(r[k]):def);
  const today=todayStr();
  const selOpts=STATUSES.map(s=>`<option value="${s}"${normSt(r.status||"pending")===s?" selected":""}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join("");
  const field=(label,k,type="text",ph="",req=false,full=false,hint="")=>`
    <div style="grid-column:${full?"1/-1":"auto"};display:flex;flex-direction:column;gap:4px">
      <label style="font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.4px">${label}${req?'<span style="color:#ef4444"> *</span>':""}</label>
      <input type="${type}" id="f_${k}" value="${v(k,type==="date"?today:"")}" placeholder="${ph}"
        style="padding:8px 12px;border-radius:8px;font-size:13px;border:1.5px solid #e5e7eb;background:#fff;color:#111827;width:100%;box-sizing:border-box"/>
      ${hint?`<span style="font-size:10px;color:#9ca3af">${hint}</span>`:""}
      <span id="e_${k}" style="font-size:11px;color:#ef4444;display:none"></span>
    </div>`;

  return `
  <div id="modal-bg" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px" onclick="closeModal()">
    <div style="background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)" onclick="event.stopPropagation()">
      <div style="padding:16px 24px;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;border-top:3px solid ${GOLD};border-radius:16px 16px 0 0">
        <h3 style="margin:0;font-size:16px;font-weight:800;color:#111827">${modal.mode==="add"?"➕ Add New RS Item":"✏️ Edit RS Item"}</h3>
        <button onclick="closeModal()" style="background:#f3f4f6;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;color:#374151;font-weight:700">✕</button>
      </div>

      <!-- Smart Status Notice -->
      <div style="margin:16px 24px 0;background:#f0fdf4;border:1px solid #a7f3d0;border-radius:8px;padding:10px 14px;font-size:11px;color:#065f46">
        🧠 <b>Smart Auto-Status:</b> Fill <b>Date Issued</b> to auto-set Served. Fill <b>Qty Issued</b> for partial tracking.
        Only <b>Cancelled</b> and <b>Reserved</b> require manual selection.
      </div>

      <div style="padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:13px">
        ${field("RS Date","rs_date","date","",true)}
        ${field("RS #","rs_num","text","e.g. 38479")}
        ${field("Description","description","text","Item name",true,true)}
        ${field("Unit of Measure","um","text","pcs, bags…")}
        ${field("Total Quantity","qty","number","",true,"","Total qty requested")}
        ${field("Qty Issued","qty_issued","number","Leave blank if none issued","",false,"Fills auto = Partial or Served")}
        ${field("WS #","ws_num","text","e.g. CW-33706")}
        ${field("Location / Site","location","text","Project site",true)}
        ${field("Date Needed","date_needed","date")}
        ${field("Date Issued","date_issued","date","","",false,"Fill this → auto Served/Partial")}
        ${field("Picked Up By","picked_up_by","text","Recipient")}
        ${field("Encoded By","encoded_by","text","Person encoding this",true)}

        <!-- Status -->
        <div style="display:flex;flex-direction:column;gap:4px">
          <label style="font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.4px">Status Override</label>
          <select id="f_status" style="padding:8px 12px;border-radius:8px;font-size:13px;border:1.5px solid #e5e7eb;background:#fff">${selOpts}</select>
          <span style="font-size:10px;color:#9ca3af">Only Cancelled & Reserved need manual selection</span>
        </div>

        <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:4px">
          <label style="font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.4px">Remarks</label>
          <textarea id="f_remarks" rows="2" placeholder="Optional notes…"
            style="padding:8px 12px;border-radius:8px;font-size:13px;border:1.5px solid #e5e7eb;width:100%;box-sizing:border-box;resize:vertical">${v("remarks")}</textarea>
        </div>

        <div style="grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;padding-top:4px">
          <button onclick="closeModal()" style="padding:9px 20px;border-radius:8px;border:1.5px solid #e5e7eb;background:#fff;color:#374151;font-weight:700;cursor:pointer;font-size:13px">Cancel</button>
          <button onclick="submitModal()" style="padding:9px 22px;border-radius:8px;border:none;background:${GOLD};color:#fff;font-weight:800;cursor:pointer;font-size:13px">💾 Save Record</button>
        </div>
      </div>
    </div>
  </div>`;
}

// ── EVENT ATTACHMENT ──────────────────────────────────
let bulkRows = [];
function attachEvents() {
  const fQEl=document.getElementById("fQ");
  if(fQEl) fQEl.addEventListener("input",e=>{ fQ=e.target.value; page=1; render(); });
  ["fSt","fYr","fEnc"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener("change",e=>{
      if(id==="fSt") fSt=e.target.value;
      if(id==="fYr") fYr=e.target.value;
      if(id==="fEnc") fEnc=e.target.value;
      page=1; render();
    });
  });
  if(view==="bulk"){ if(!bulkRows.length) resetBulkRows(); renderBulkTable(); }
}

function resetBulkRows() {
  const today=todayStr();
  bulkRows=[...Array(3)].map(()=>({rs_date:today,description:"",um:"pcs",qty:1,qty_issued:"",rs_num:"",ws_num:"",location:"",date_needed:today,date_issued:"",picked_up_by:"",status:"pending",encoded_by:"",remarks:""}));
}

function renderBulkTable() {
  const tbody=document.getElementById("bulk-body"); if(!tbody) return;
  const IS="width:100%;padding:4px 7px;border:1px solid #e5e7eb;border-radius:5px;font-size:11px;box-sizing:border-box";
  tbody.innerHTML=bulkRows.map((r,i)=>{
    const autoSt=computeStatus(r);
    const c=SC[autoSt]||SC.pending;
    return `<tr style="border-bottom:1px solid #f3f4f6;background:${i%2===0?"#fff":"#fafafa"}">
      <td style="padding:4px 6px;width:115px"><input type="date" value="${esc(r.rs_date)}" onchange="bulkUpd(${i},'rs_date',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:175px"><input type="text" value="${esc(r.description)}" oninput="bulkUpd(${i},'description',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:60px"><input type="text" value="${esc(r.um)}" oninput="bulkUpd(${i},'um',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:58px"><input type="number" value="${r.qty}" oninput="bulkUpd(${i},'qty',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:70px"><input type="number" value="${r.qty_issued}" oninput="bulkUpd(${i},'qty_issued',this.value)" placeholder="opt." style="${IS}"/></td>
      <td style="padding:4px 6px;width:80px"><input type="text" value="${esc(r.rs_num)}" oninput="bulkUpd(${i},'rs_num',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:95px"><input type="text" value="${esc(r.ws_num)}" oninput="bulkUpd(${i},'ws_num',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:160px"><input type="text" value="${esc(r.location)}" oninput="bulkUpd(${i},'location',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:110px"><input type="date" value="${esc(r.date_needed)}" onchange="bulkUpd(${i},'date_needed',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:110px"><input type="date" value="${esc(r.date_issued)}" onchange="bulkUpd(${i},'date_issued',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:110px"><input type="text" value="${esc(r.picked_up_by)}" oninput="bulkUpd(${i},'picked_up_by',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:115px;background:#f0f7ff"><input type="text" value="${esc(r.encoded_by)}" oninput="bulkUpd(${i},'encoded_by',this.value)" style="${IS}"/></td>
      <td style="padding:4px 6px;width:115px"><input type="text" value="${esc(r.remarks)}" oninput="bulkUpd(${i},'remarks',this.value)" style="${IS}"/></td>
      <td style="padding:4px 8px;width:90px;background:#f0fdf4">
        <span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;background:${c.bg};color:${c.text}">
          <span style="width:5px;height:5px;border-radius:50%;background:${c.dot};display:inline-block"></span>
          ${autoSt.charAt(0).toUpperCase()+autoSt.slice(1)}</span>
      </td>
      <td style="padding:4px 8px"><button onclick="bulkRmRow(${i})" style="background:#fee2e2;border:none;color:#ef4444;cursor:pointer;border-radius:5px;padding:3px 8px;font-weight:800">✕</button></td>
    </tr>`;
  }).join("");
}

// ── GLOBAL WINDOW FUNCTIONS ───────────────────────────
window.setView  = v => { view=v; page=1; render(); };
window.setPage  = p => { page=p; render(); };
window.openAddModal  = () => { modal={mode:"add",rec:{}}; render(); };
window.openEditModal = (rec) => { modal={mode:"edit",rec}; render(); };
window.closeModal    = () => { modal=null; render(); };

window.submitModal = async () => {
  const get = id => document.getElementById(id)?.value||"";
  const data = {
    rs_date:     get("f_rs_date"),      description: get("f_description"),
    um:          get("f_um"),           qty:         get("f_qty"),
    qty_issued:  get("f_qty_issued"),   rs_num:      get("f_rs_num"),
    ws_num:      get("f_ws_num"),       location:    get("f_location"),
    date_needed: get("f_date_needed"),  date_issued:  get("f_date_issued"),
    picked_up_by:get("f_picked_up_by"), status:      get("f_status"),
    encoded_by:  get("f_encoded_by"),   remarks:     get("f_remarks"),
  };
  let ok=true;
  ["description","rs_date","location","encoded_by"].forEach(k=>{
    const el=document.getElementById(`e_${k}`);
    if(!data[k]?.trim()&&el){ el.textContent="Required"; el.style.display=""; ok=false; }
    else if(el) el.style.display="none";
  });
  const qEl=document.getElementById("e_qty");
  if(isNaN(+data.qty)||data.qty===""){ if(qEl){qEl.textContent="Must be a number";qEl.style.display="";} ok=false; }
  else if(qEl) qEl.style.display="none";
  if(!ok) return;
  const btn=document.querySelector("#modal-bg button[onclick='submitModal()']");
  if(btn){ btn.textContent="Saving…"; btn.disabled=true; }
  try {
    if(modal.mode==="add") await saveRecord(data);
    else await updateRecord(modal.rec._fid, data);
    modal=null;
  } catch(e) { alert("Save failed: "+e.message); if(btn){btn.textContent="💾 Save Record";btn.disabled=false;} }
};

window.deleteRecord = async fid => { await deleteRecord(fid); };
window.bulkUpd = (i,k,v) => { bulkRows[i][k]=v; renderBulkTable(); };
window.bulkAddRow = () => {
  const today=todayStr();
  bulkRows.push({rs_date:today,description:"",um:"pcs",qty:1,qty_issued:"",rs_num:"",ws_num:"",location:"",date_needed:today,date_issued:"",picked_up_by:"",status:"pending",encoded_by:"",remarks:""});
  renderBulkTable();
};
window.bulkRmRow = i => { if(bulkRows.length>1) bulkRows.splice(i,1); renderBulkTable(); };
window.bulkSave  = async () => {
  const valid=bulkRows.filter(r=>r.description.trim()&&r.location.trim()&&r.encoded_by.trim());
  const msgEl=document.getElementById("bulk-msg");
  if(!valid.length){ if(msgEl) msgEl.innerHTML=`<div style="padding:8px 16px;border-radius:8px;background:#fee2e2;color:#991b1b;font-size:13px;font-weight:700;margin-bottom:10px">⚠️ Fill Description, Location, and Encoded By for at least one row.</div>`; setTimeout(()=>{if(msgEl)msgEl.innerHTML="";},4000); return; }
  if(msgEl) msgEl.innerHTML=`<div style="padding:8px 16px;border-radius:8px;background:#fef3c7;color:#92400e;font-size:13px;font-weight:700;margin-bottom:10px">⏳ Saving ${valid.length} record(s)…</div>`;
  try {
    for(const r of valid) await saveRecord(r);
    resetBulkRows(); renderBulkTable();
    if(msgEl) msgEl.innerHTML=`<div style="padding:8px 16px;border-radius:8px;background:#d1fae5;color:#065f46;font-size:13px;font-weight:700;margin-bottom:10px">✅ ${valid.length} record(s) saved to Firebase!</div>`;
    setTimeout(()=>{if(msgEl)msgEl.innerHTML="";},4000);
  } catch(e){ if(msgEl) msgEl.innerHTML=`<div style="padding:8px 16px;border-radius:8px;background:#fee2e2;color:#991b1b;font-size:13px;font-weight:700;margin-bottom:10px">❌ Save failed: ${esc(e.message)}</div>`; }
};

setInterval(tickClock, 1000);
render();
</script>
</body>
</html>
